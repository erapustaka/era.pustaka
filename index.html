<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Buku Pintar - Filter Kategori</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #f4f7f6;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); }

        /* Header & Nav */
        header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        
        .filter-nav {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            position: sticky;
            top: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .category-btn {
            padding: 8px 20px;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .category-btn.active, .category-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* Grid Buku */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .book-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        /* Class untuk sembunyikan buku */
        .hidden { display: none; }

        .book-card img { width: 100%; height: 280px; object-fit: cover; }
        .info { padding: 15px; }
        .tag { font-size: 0.7rem; background: #eee; padding: 3px 8px; border-radius: 5px; text-transform: uppercase; }
        .title { font-weight: bold; margin: 10px 0 5px; font-size: 1.1rem; }
        .price { color: var(--accent); font-weight: bold; }

        .btn-wa {
            display: block;
            background: #25d366;
            color: white;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            margin-top: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<header>
    <h1>📚 Era Pustaka Utama</h1>
    <p>Cari kategori buku favoritmu di bawah ini</p>
</header>

<div class="filter-nav">
    <button class="category-btn active" onclick="filterBuku('semua')">Semua</button>
    <button class="category-btn" onclick="filterBuku('bisnis')">Bisnis</button>
    <button class="category-btn" onclick="filterBuku('teknologi')">Teknologi</button>
    <button class="category-btn" onclick="filterBuku('novel')">Novel</button>
</div>

<div class="container">
    <div class="book-grid" id="daftarBuku">
        
        <!-- Buku 1 -->
        <div class="book-card" data-category="bisnis">
            <img src="https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=400" alt="Bisnis">
            <div class="info">
                <span class="tag">Bisnis</span>
                <div class="title">Strategi Pemasaran 5.0</div>
                <div class="price">Rp 115.000</div>
                <a href="#" class="btn-wa">Beli di WA</a>
            </div>
        </div>

        <!-- Buku 2 -->
        <div class="book-card" data-category="teknologi">
            <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=400" alt="Teknologi">
            <div class="info">
                <span class="tag">Teknologi</span>
                <div class="title">Belajar Coding AI</div>
                <div class="price">Rp 150.000</div>
                <a href="#" class="btn-wa">Beli di WA</a>
            </div>
        </div>

        <!-- Buku 3 -->
        <div class="book-card" data-category="novel">
            <img src="https://images.unsplash.com/photo-1543004629-142a7a5f679a?q=80&w=400" alt="Novel">
            <div class="info">
                <span class="tag">Novel</span>
                <div class="title">Sendunya Pelangi</div>
                <div class="price">Rp 55.000</div>
                <a href="#" class="btn-wa">Beli di WA</a>
            </div>
        </div>

        <!-- Buku 4 -->
        <div class="book-card" data-category="bisnis">
            <img src="https://images.unsplash.com/photo-1554774853-aae0a22c8aa4?q=80&w=400" alt="Bisnis">
            <div class="info">
                <span class="tag">Bisnis</span>
                <div class="title">Investasi Saham Pemula</div>
                <div class="price">Rp 90.000</div>
                <a href="#" class="btn-wa">Beli di WA</a>
            </div>
        </div>

    </div>
</div>

<script>
    function filterBuku(kategori) {
        // Ambil semua kartu buku
        const books = document.querySelectorAll('.book-card');
        const buttons = document.querySelectorAll('.category-btn');

        // Ubah warna tombol yang aktif
        buttons.forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.toLowerCase() === kategori) btn.classList.add('active');
            if(kategori === 'semua' && btn.innerText === 'Semua') btn.classList.add('active');
        });

        // Logika menyembunyikan/menampilkan buku
        books.forEach(book => {
            if (kategori === 'semua') {
                book.classList.remove('hidden');
            } else {
                if (book.getAttribute('data-category') === kategori) {
                    book.classList.remove('hidden');
                } else {
                    book.classList.add('hidden');
                }
            }
        });
    }
</script>

</body>
</html>
